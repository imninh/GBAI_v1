; GreenBinAI IoT — Phase 1 firmware
;
; Two environments:
;   esp32cam : the real target (AI Thinker ESP32-CAM, Arduino framework)
;   native   : desktop build of the pure-logic core only, for unit tests
;
; The `native` env compiles src/core/ exclusively. Everything in src/core/ is
; free of Arduino.h by construction, which is what lets the state machine,
; fill-level maths, retry policy and result mapping be tested without hardware
; (spec §18, §22). Hardware drivers live in src/hw/ and are thin wrappers.

[platformio]
default_envs = esp32cam
src_dir = src
include_dir = include

[common]
build_flags =
    -DFIRMWARE_VERSION=\"0.1.0\"
    -Wall

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.1.0
; Core logic + hardware drivers + main.cpp. src/sim/ is desktop-only.
build_src_filter = +<*> -<sim/>

; Same firmware with the OV2640 replaced by a fixture-JPEG mock. Wokwi does not
; simulate the camera, so this is the build used for simulation (spec §18).
[env:esp32cam_mock]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -DGREENBIN_USE_MOCK_CAMERA=1
build_src_filter = +<*> -<sim/> -<hw/camera_service.cpp>

; Wokwi-specific build. The simulator exposes the open Wokwi-GUEST network and
; reaches a backend on this computer through the Private IoT Gateway hostname.
; The device key is intentionally a local simulation value, not a real secret.
[env:wokwi]
extends = env:esp32cam_mock
build_flags =
    ${env:esp32cam_mock.build_flags}
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DBACKEND_BASE_URL=\"http://host.wokwi.internal:8123\"
    -DDEVICE_ID=\"GBIN-001\"
    -DBIN_CODE=\"BIN-001\"
    -DDEVICE_KEY=\"sim-test-key\"
    -DPIR_WAIT_MS=5000UL
    -DFILL_INTERVAL_MS=5000UL

; Host simulator: the real state machine driving the real backend over a real
; socket. Closes the device↔backend contract gap without hardware.
[env:sim]
platform = native
build_flags =
    ${common.build_flags}
    -DGREENBIN_NATIVE=1
    -std=gnu++17
build_src_filter = +<core/> +<sim/>

[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -DGREENBIN_NATIVE=1
    -std=gnu++17
; Pure logic only — no Arduino.h, no main.cpp
build_src_filter = +<core/>
; Link src/core/ into the test binaries; off by default in PlatformIO.
test_build_src = yes
