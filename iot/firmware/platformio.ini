; GreenBinAI IoT — Phase 1 firmware
;
; Two environments:
;   esp32cam : the real target (AI Thinker ESP32-CAM, Arduino framework)
;   native   : desktop build of the pure-logic core only, for unit tests
;
; The `native` env compiles src/core/ exclusively. Everything in src/core/ is
; free of Arduino.h by construction, which is what lets the state machine,
; fill-level maths, retry policy and result mapping be tested without hardware
; (spec §18, §22). Hardware drivers live in src/hw/ and are thin wrappers.

[platformio]
default_envs = esp32cam
src_dir = src
include_dir = include

[common]
build_flags =
    -DFIRMWARE_VERSION=\"0.1.0\"
    -Wall

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.1.0
; Core logic + hardware drivers + main.cpp. src/sim/ is desktop-only.
; The servo, OLED, mock backend, test console and heartbeat belong to the
; simulation build; this environment has no GPIO free for them (pin-map.md §4).
build_src_filter =
    +<*>
    -<sim/>
    -<hw/servo_sorter.cpp>
    -<hw/oled_display.cpp>
    -<hw/test_console.cpp>
    -<hw/wifi_heartbeat.cpp>

; Same firmware with the OV2640 replaced by a fixture-JPEG mock. Wokwi does not
; simulate the camera, so this is the build used for simulation (spec §18).
[env:esp32cam_mock]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -DGREENBIN_USE_MOCK_CAMERA=1
build_src_filter =
    ${env:esp32cam.build_src_filter}
    -<hw/camera_service.cpp>

; Wokwi-specific build — the Checkpoint 1 simulation target.
;
; Board: ESP32 DevKit-C V4, which unlike the ESP32-CAM has GPIO free for the
; servo and the I2C OLED, so both are compiled in here and only here.
;
; The classifier is the offline mock (GREENBIN_MOCK_BACKEND): the whole flow
; runs with no network and no backend process, which is what makes the demo
; reproducible. Wi-Fi is still brought up for the P1 heartbeat, but nothing in
; the sorting flow depends on it.
;
; The device key is intentionally a local simulation value, not a real secret.
[env:wokwi]
extends = env:esp32cam_mock
build_flags =
    ${env:esp32cam_mock.build_flags}
    -DGREENBIN_MOCK_BACKEND=1
    -DGREENBIN_HAS_SORTER=1
    -DGREENBIN_HAS_DISPLAY=1
    -DGREENBIN_TEST_CONSOLE=1
    -DGREENBIN_ENABLE_WIFI=1
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DBACKEND_BASE_URL=\"http://host.wokwi.internal:8123\"
    -DDEVICE_ID=\"GBIN-001\"
    -DBIN_CODE=\"BIN-001\"
    -DDEVICE_KEY=\"sim-test-key\"
    -DPIR_WAIT_MS=5000UL
    -DFILL_INTERVAL_MS=15000UL
    ; Simulation calibration: the Wokwi HC-SR04 slider spans 0–400 cm, and
    ; 50 cm → 0% / 5 cm → 100% maps its usable range onto the whole scale.
    -DEMPTY_DISTANCE_CM=50.0f
    -DFULL_DISTANCE_CM=5.0f
lib_deps =
    ${env:esp32cam.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
build_src_filter =
    +<*>
    -<sim/>
    -<hw/camera_service.cpp>
    -<hw/network_service.cpp>

; Wokwi + real image + real backend — the "complete demo" build.
;
; Differs from `wokwi` in exactly two places, both of which make the demo MORE
; real rather than less:
;
;   camera   : the JPEG comes from the PC's webcam over HTTP (host_camera.cpp)
;              instead of a fixture, so a real object is photographed
;   backend  : EspNetworkService, so the device really uploads that JPEG to
;              /api/v1/iot/captures and the real classifier answers
;
; Everything downstream — sorting decision, servo, OLED, fill level — is the
; same code as the mock build. Requires: the Wokwi Private IoT Gateway running,
; the backend on :8123, and webcam_service.py on :8124. See iot-checkpoint-1.md.
[env:wokwi_camera]
extends = env:wokwi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DGREENBIN_HOST_CAMERA=1
    -DGREENBIN_HAS_SORTER=1
    -DGREENBIN_HAS_DISPLAY=1
    -DGREENBIN_TEST_CONSOLE=1
    -DGREENBIN_ENABLE_WIFI=1
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DBACKEND_BASE_URL=\"http://host.wokwi.internal:8123\"
    -DHOST_CAMERA_URL=\"http://host.wokwi.internal:8124/frame.jpg\"
    -DDEVICE_ID=\"GBIN-001\"
    -DBIN_CODE=\"BIN-001\"
    -DDEVICE_KEY=\"sim-test-key\"
    -DPIR_WAIT_MS=5000UL
    -DFILL_INTERVAL_MS=15000UL
    -DEMPTY_DISTANCE_CM=50.0f
    -DFULL_DISTANCE_CM=5.0f
build_src_filter =
    +<*>
    -<sim/>
    -<hw/camera_service.cpp>

; Host simulator: the real state machine driving the real backend over a real
; socket. Closes the device↔backend contract gap without hardware.
[env:sim]
platform = native
build_flags =
    ${common.build_flags}
    -DGREENBIN_NATIVE=1
    -std=gnu++17
build_src_filter = +<core/> +<sim/>

[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -DGREENBIN_NATIVE=1
    -std=gnu++17
; Pure logic only — no Arduino.h, no main.cpp
build_src_filter = +<core/>
; Link src/core/ into the test binaries; off by default in PlatformIO.
test_build_src = yes
