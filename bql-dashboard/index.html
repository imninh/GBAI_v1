<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BQL Smart Trash Bin Dashboard - Bản Đồ & Điểm Cảnh Báo</title>
  
  <!-- Google Fonts: Inter & Code font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Left Navigation Rail -->
    <nav class="nav-rail">
      <div class="nav-logo" title="BQL GreenBin Ops">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>

      <div class="nav-links">
        <a href="index.html" class="nav-item active" title="Bản đồ Thùng rác">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
          <span class="nav-item-tooltip">Bản đồ Giám sát</span>
        </a>

        <a href="markdown.html" class="nav-item" title="Soạn thảo Markdown / Báo cáo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="nav-item-tooltip">Báo cáo Markdown</span>
        </a>
      </div>
    </nav>

    <!-- Sidebar Control Panel -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-header">
        <div class="header-top">
          <h2 class="dashboard-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5">
              <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            BQL Smart Trash
          </h2>
          <div class="live-tag">
            <span class="live-dot"></span>
            LIVE IoT
          </div>
        </div>
        <p class="dashboard-subtitle">Hệ thống Giám sát & Cảnh báo Thùng rác Thông minh</p>
      </div>

      <!-- Stats Metric Cards -->
      <div class="stats-overview-grid">
        <div class="stat-card">
          <div class="stat-label">Tổng số điểm</div>
          <div class="stat-val-group">
            <span class="stat-number" id="stat-total" style="color: #F8FAFC;">0</span>
            <div class="stat-icon" style="background: rgba(59, 130, 246, 0.15); color: #3B82F6;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Cảnh báo Đầy</div>
          <div class="stat-val-group">
            <span class="stat-number" id="stat-critical" style="color: #EF4444;">0</span>
            <div class="stat-icon" style="background: rgba(239, 68, 68, 0.15); color: #EF4444;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Mức Trung Bình</div>
          <div class="stat-val-group">
            <span class="stat-number" id="stat-moderate" style="color: #F59E0B;">0</span>
            <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: #F59E0B;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Hết Pin / Lỗi</div>
          <div class="stat-val-group">
            <span class="stat-number" id="stat-offline" style="color: #6B7280;">0</span>
            <div class="stat-icon" style="background: rgba(107, 114, 128, 0.15); color: #6B7280;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="11" x2="23" y2="13"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="search-filter-section">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-bin-input" placeholder="Tìm theo tên vị trí, tòa nhà, mã BIN...">
        </div>

        <div class="filter-chips-wrapper">
          <button class="filter-chip active" data-filter="all">Tất cả</button>
          <button class="filter-chip" data-filter="critical">🔴 Đầy (≥80%)</button>
          <button class="filter-chip" data-filter="moderate">🟡 Trung bình</button>
          <button class="filter-chip" data-filter="normal">🟢 Bình thường</button>
          <button class="filter-chip" data-filter="offline">⚪ Hết pin</button>
        </div>
      </div>

      <!-- Scrollable Bin List -->
      <div class="bin-list-section">
        <div class="bin-list-header">
          <span>DANH SÁCH ĐIỂM CẢNH BÁO</span>
          <span id="filtered-count">0 thùng</span>
        </div>
        
        <div id="bin-list-container">
          <!-- Dynamically populated via stats.js -->
        </div>
      </div>
    </aside>

    <!-- Main Map View Area -->
    <main class="map-view-wrapper">
      <!-- Quick Floating Controls -->
      <div class="map-floating-bar">
        <button class="floating-btn" onclick="window.fitAllMapBounds()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          Fit Bounds (Toàn bộ)
        </button>

        <button class="floating-btn" onclick="window.generateShortestRoute(true)" style="background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(245,158,11,0.25)); border-color: rgba(239,68,68,0.4); color: #FCA5A5;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
          </svg>
          🔴 Tuyến Thu Gom Đầy (Gấp)
        </button>

        <button class="floating-btn" onclick="window.generateShortestRoute(false)" style="background: linear-gradient(135deg, rgba(6,182,212,0.25), rgba(59,130,246,0.25)); border-color: rgba(6,182,212,0.4); color: #7DD3FC;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          🗺️ Tối Ưu Tuyến Đường (TSP)
        </button>
      </div>

      <div id="map-container"></div>
    </main>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- App JS Modules -->
  <script src="js/trash-data.js"></script>
  <script src="js/trash-marker.js"></script>
  <script src="js/route-optimizer.js"></script>
  <script src="js/map.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
