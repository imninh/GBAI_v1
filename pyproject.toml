[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t-075-recycling-waste-agent"
version = "0.1.0"
description = "AI Agent hỗ trợ phân loại rác thải tái chế cho đội T-075"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Team T-075" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.urls]
Repository = "https://github.com/AI20K-Build-Phase-Cohort-3/P-075"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
