name: CI

on:
  push:
    # Nhánh `feature/**` PHẢI có mặt: toàn bộ công việc từ 10/08 tới nay nằm
    # trên một nhánh feature chưa mở PR, nên CI chưa kiểm một dòng nào trong 32
    # gói. Cổng kiểm chỉ có tác dụng nếu nó chạy TRƯỚC lúc mở PR.
    branches: [main, develop, "feature/**"]
  pull_request:
    # `develop` PHẢI có mặt: quy trình nhóm đưa nhánh feature vào `develop` qua
    # Pull Request, nên đây mới là chỗ CI cần chặn. Thiếu dòng này thì đúng
    # những PR quan trọng nhất lại không được kiểm gì.
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Khớp với phiên bản chạy ở máy dev. Lệch phiên bản giữa CI và máy
          # thật làm lỗi chỉ lộ ra ở một trong hai chỗ.
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        # `scripts/` PHẢI có mặt: cổng kiểm ở máy dev là
        # `ruff check src/ tests/ eval/ scripts/`, và `scripts/` chứa
        # `log_hook.py` (deliverable #4) lẫn các script vận hành demo. Thiếu nó
        # thì CI xanh trong khi máy dev đỏ — CI dễ dãi hơn người là CI vô dụng.
        run: ruff check src/ tests/ eval/ scripts/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  # Frontend là một nửa sản phẩm mà trước đây CI không kiểm gì cả — một lỗi
  # kiểu sẽ chỉ lộ ra lúc build APK hoặc lúc Vercel deploy, tức là quá muộn.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (xuất tĩnh ra out/)
        run: npx next build
