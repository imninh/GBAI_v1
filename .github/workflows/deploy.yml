  #   runs-on: self-hosted
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Cài Railway CLI
  #       run: npm i -g @railway/cli
  #     - name: Railway up
  #       run: railway up --service <TÊN_SERVICE_BE> --detach
  #       env:
  #         RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
