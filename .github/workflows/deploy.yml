name: Deploy production (repo nhóm → gbai-v1)

# Deploy FE lên project Vercel `gbai-v1` khi merge vào `main` (phương án a: dùng
# lại project cũ, chỉ chuyển NGUỒN deploy sang repo tổ chức).
#
# Chạy trên self-hosted runner CHUNG của BTC — không tốn Actions minutes của org
# (đó là lý do BTC cấp runner). Đọc 3 secret ở repo nhóm:
#   VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID
#
# ⚠️ Điều kiện để build ĐÚNG: project `gbai-v1` trên Vercel PHẢI giữ nguyên
# "Root Directory = frontend" như hồi deploy qua Git. `vercel pull` kéo cấu hình
# đó về → CLI tự build thư mục frontend/. Vì vậy các lệnh vercel chạy ở GỐC repo
# (không cd vào frontend). Nếu deploy đầu ra sai gốc → kiểm Root Directory ở
# Vercel dashboard trước khi sửa file này.

on:
  push:
    branches: [main]

# Push liên tiếp thì huỷ deploy cũ, chỉ giữ cái mới nhất.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: self-hosted
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài Vercel CLI
        run: npm i -g vercel@latest

      # Kéo cấu hình project gbai-v1 (Root Directory + env production) về nhờ
      # ORG_ID/PROJECT_ID — không cần commit thư mục .vercel.
      - name: Vercel pull (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy (prebuilt, production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # --- BE Railway: deploy TỪ repo tổ chức (thay cho Git-integration repo cá nhân)
  # `railway up` nén source (Dockerfile ở gốc repo) gửi lên Railway build+deploy
  # service `greenbin-api`. Token project-scoped (RAILWAY_TOKEN) cho biết project
  # + environment; `--service` chọn service. Env vars của service (DATABASE_URL,
  # SUPABASE_*, ...) giữ nguyên — chỉ thay CODE. Sau khi job này chạy OK thì mới
  # Disconnect Git repo cá nhân khỏi Railway (tránh 2 nguồn deploy).
  deploy-backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài Railway CLI
        run: npm i -g @railway/cli

      - name: Railway up (deploy BE từ repo tổ chức)
        run: railway up --service greenbin-api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
